[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "boe-sentiment"
version = "0.1.0"
description = "NLP pipeline quantifying Bank of England MPC hawkishness and backtesting against UK gilt yields"
authors = ["Kostadin Stoyanov"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/kostadinstoyanovuk/boe-sentiment-engine"
repository = "https://github.com/kostadinstoyanovuk/boe-sentiment-engine"
keywords = ["nlp", "finance", "bank-of-england", "sentiment", "gilts", "quantitative-finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

packages = [{include = "boe_sentiment", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10"
pandas = ">=2.0"
numpy = ">=1.24"
requests = ">=2.28"
beautifulsoup4 = ">=4.12"
pdfplumber = ">=0.10"
transformers = ">=4.30"
torch = ">=2.0"
statsmodels = ">=0.14"
scipy = ">=1.10"
matplotlib = ">=3.7"
seaborn = ">=0.12"
pyarrow = ">=12.0"
fredapi = ">=0.5"
python-dotenv = ">=1.0"
tqdm = ">=4.65"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
pytest-cov = ">=4.1"
black = ">=23.0"
ruff = ">=0.1"
mypy = ">=1.5"
pre-commit = ">=3.4"

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/boe_sentiment --cov-report=term-missing"
